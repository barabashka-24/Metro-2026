            padding: 0;
            box-sizing: border-box;
        }

            margin: 0;
            min-height: 100vh;

            justify-content: center; /* по горизонтали */
            align-items: center;     /* по вертикали */

            position: relative;
            display: inline-block;
            line-height: 0;

<div id="loader" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 20;">
    <div style="width: 32px; height: 32px; border: 3px solid #E0E0E0; border-top: 3px solid #1951B5; border-radius: 50%; animation: spin 1s linear infinite;"></div>
</div>

<style>
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
</style>

<div id="map-container">

</div>

<script>
    const img = document.getElementById('map-image');
    const loader = document.getElementById('loader');

    img.onload = function() {
        loader.style.display = 'none';
        img.style.display = 'block';
        createHitAreas();   // вызываем после полной загрузки
    };
    // Если изображение уже загружено из кеша – onload не сработает, проверим
    if (img.complete) {
        img.onload();       // вызовем вручную
    }
</script>

    function createHitAreas() {
        const img = document.getElementById('map-image');
        const container = document.getElementById('map-container');
        if (!img || !container) return;

        const oldHits = document.querySelectorAll('.station-hit');
        oldHits.forEach(h => h.remove());

        const imgWidth = img.offsetWidth;
        const imgHeight = img.offsetHeight;

        stations.forEach(station => {
            const left = (station.x1 / 100) * imgWidth;
            const top = (station.y1 / 100) * imgHeight;
            const width = ((station.x2 - station.x1) / 100) * imgWidth;
            const height = ((station.y2 - station.y1) / 100) * imgHeight;

            if (width <= 0 || height <= 0) return;

            const hitDiv = document.createElement('div');
            hitDiv.className = 'station-hit';
            hitDiv.style.left = left + 'px';
            hitDiv.style.top = top + 'px';
            hitDiv.style.width = width + 'px';
            hitDiv.style.height = height + 'px';
            hitDiv.addEventListener('click', function(e) {
                e.stopPropagation();
                if (typeof Android !== 'undefined') {
                    Android.showStation(station.id);
                }
            });
            hitDiv.title = station.name;
            container.appendChild(hitDiv);
        });
    }

    window.addEventListener('load', createHitAreas);
    window.addEventListener('resize', createHitAreas);

    window.addEventListener('load', function () {
        setTimeout(function () {
            const container = document.getElementById('map-container');
            const x =
                (container.offsetWidth - window.innerWidth) / 2;
            const y =
                (container.offsetHeight - window.innerHeight) / 2;
            window.scrollTo({
                left: x,
                top: y,
                behavior: 'instant'
            });
        }, 300);
    });
